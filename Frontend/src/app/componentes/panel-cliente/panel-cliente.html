<div class="flex flex-1 min-h-0 bg-gray-50 overflow-hidden font-sans" role="region" aria-label="Panel de cliente">
  <app-cliente-sidebar
    [vistaActual]="vistaActual"
    [sidebarCollapsed]="sidebarCollapsed"
    [pedidosActivos]="pedidosActivos"
    [totalFavoritos]="totalFavoritos"
    [currentUser]="currentUser"
    [inicialUsuario]="inicialUsuario"
    (vistaChange)="cambiarVista($event)"
    (toggleSidebar)="toggleSidebar()"
    (logoutRequest)="cerrarSesion()"
  ></app-cliente-sidebar>

  <section class="flex-1 flex flex-col min-h-0 overflow-hidden relative min-w-0">
    <div class="md:hidden flex items-center justify-between gap-3 bg-white border-b border-gray-200 px-4 py-3 shrink-0">
      <div class="flex items-center gap-3 min-w-0">
        <button
          type="button"
          class="w-9 h-9 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-800 flex items-center justify-center shrink-0 transition-colors"
          (click)="toggleSidebar()"
          aria-label="Abrir menú de cliente"
        >
          <i class="bi bi-list text-xl"></i>
        </button>
        <div class="min-w-0">
          <h2 class="font-bold text-gray-900 text-sm sm:text-base truncate m-0">{{ getVistaTituloActual() }}</h2>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button
          type="button"
          *ngIf="pedidosActivos > 0"
          (click)="cambiarVista('pedidos')"
          class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 hover:bg-amber-200 transition-colors cursor-pointer border-0"
          [attr.aria-label]="'Ver ' + pedidosActivos + ' pedidos activos'"
        >
          <i class="bi bi-clock-history mr-1" aria-hidden="true"></i>{{ pedidosActivos }}
        </button>
        <button
          type="button"
          class="bg-red-600 hover:bg-red-700 text-white font-bold py-1.5 px-3 rounded-xl text-xs transition-all flex items-center gap-1.5 shrink-0 cursor-pointer"
          (click)="navegarA('/menu')"
        >
          <i class="bi bi-cart-plus"></i> Menú
        </button>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto overflow-x-hidden p-3 sm:p-6 lg:p-8 min-w-0 w-full">
      <div class="max-w-7xl mx-auto">
        <app-cliente-dashboard
          *ngIf="vistaActual === 'dashboard'"
          (vistaChange)="cambiarVista($event)"
          (metricasActualizadas)="onMetricasDashboardActualizadas($event)"
        ></app-cliente-dashboard>
        <app-cliente-perfil *ngIf="vistaActual === 'perfil'"></app-cliente-perfil>
        <app-cliente-pedidos *ngIf="vistaActual === 'pedidos'"></app-cliente-pedidos>
        <app-reviews *ngIf="vistaActual === 'resenas'"></app-reviews>
        <app-favoritos *ngIf="vistaActual === 'favoritos'"></app-favoritos>
      </div>
    </div>
  </section>

  <div
    *ngIf="mostrarModalLogout"
    class="fixed inset-0 bg-black/60 z-[6000] flex items-center justify-center p-4 backdrop-blur-xs"
    role="dialog"
    aria-modal="true"
    aria-labelledby="logout-modal-title-cliente"
  >
    <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden animate-fade-in-up border border-gray-200">
      <div class="px-6 py-4 bg-gray-900 text-white flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-red-600 flex items-center justify-center text-white">
            <i class="bi bi-box-arrow-left text-sm"></i>
          </div>
          <div>
            <h3 id="logout-modal-title-cliente" class="text-base font-bold text-white m-0">Cerrar Sesión</h3>
          </div>
        </div>
        <button
          type="button"
          (click)="cancelarLogout()"
          class="w-8 h-8 flex items-center justify-center rounded-xl bg-white/10 text-gray-300 hover:bg-white/20 hover:text-white transition-colors cursor-pointer"
          aria-label="Cancelar"
        >
          <i class="bi bi-x-lg text-xs"></i>
        </button>
      </div>

      <div class="p-6 space-y-4">
        <p class="text-sm text-gray-600 m-0 leading-relaxed">
          ¿Estás seguro de que deseas cerrar tu sesión, <strong class="text-gray-900">{{ primerNombre }}</strong>? Podrás volver a ingresar cuando quieras.
        </p>

        <div class="flex items-center justify-end gap-3 pt-2">
          <button
            type="button"
            (click)="cancelarLogout()"
            class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-sm transition-colors cursor-pointer"
          >
            Cancelar
          </button>
          <button
            type="button"
            (click)="confirmarLogout()"
            class="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-sm shadow-sm transition-colors flex items-center gap-2 cursor-pointer"
          >
            <i class="bi bi-box-arrow-left"></i> Sí, Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
