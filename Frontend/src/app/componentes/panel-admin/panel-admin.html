<div class="flex flex-1 min-h-0 bg-gray-50 overflow-hidden font-sans" role="region" aria-label="Panel de administración">
  <app-admin-sidebar
    [vistaActual]="vistaActual"
    [sidebarCollapsed]="sidebarCollapsed"
    [alertasStockTotal]="alertasStockTotal"
    [deliveryFeeActual]="deliveryFeeActual"
    [currentUser]="currentUser"
    [currentUserInitial]="currentUserInitial"
    (vistaChange)="cambiarVista($event)"
    (toggleSidebar)="toggleSidebar()"
    (logoutRequest)="cerrarSesion()"
  ></app-admin-sidebar>

  <section class="flex-1 flex flex-col min-h-0 overflow-hidden relative min-w-0">
    <div class="md:hidden flex items-center justify-between gap-3 bg-white border-b border-gray-200 px-4 py-3 shrink-0">
      <div class="flex items-center gap-3 min-w-0">
        <button
          type="button"
          class="w-9 h-9 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-800 flex items-center justify-center shrink-0 transition-colors"
          (click)="toggleSidebar()"
          aria-label="Abrir menú del panel"
        >
          <i class="bi bi-list text-xl"></i>
        </button>
        <div class="min-w-0">
          <p class="text-[10px] font-black uppercase tracking-widest text-red-600 m-0 leading-none">Panel Admin</p>
          <h2 class="font-black text-gray-900 text-sm truncate m-0 mt-0.5">{{ getVistaTituloActual() }}</h2>
        </div>
      </div>
      <span
        *ngIf="alertasStockTotal > 0"
        (click)="cambiarVista('inventario')"
        class="px-2.5 py-1 rounded-full text-[11px] font-black bg-amber-100 text-amber-800 shrink-0 cursor-pointer"
      >
        <i class="bi bi-exclamation-triangle-fill mr-1"></i>{{ alertasStockTotal }}
      </span>
    </div>

    <div class="flex-1 overflow-y-auto overflow-x-hidden p-3 sm:p-6 lg:p-8 min-w-0 w-full">
      <div class="max-w-7xl mx-auto">
        <app-admin-dashboard
          *ngIf="vistaActual === 'dashboard'"
          (vistaChange)="cambiarVista($event)"
          (verPedido)="verDetallePedido($event)"
          (inventarioActualizado)="onInventarioDashboardActualizado($event)"
        ></app-admin-dashboard>
        <app-finanzas-dashboard *ngIf="vistaActual === 'finanzas'"></app-finanzas-dashboard>
        <app-inventario *ngIf="vistaActual === 'inventario'"></app-inventario>
        <app-perdidas *ngIf="vistaActual === 'perdidas'"></app-perdidas>
        <app-costos-produccion *ngIf="vistaActual === 'costos-produccion'"></app-costos-produccion>
        <app-usuarios *ngIf="vistaActual === 'usuarios'"></app-usuarios>
        <app-pizzas *ngIf="vistaActual === 'pizzas'"></app-pizzas>
        <app-categorias *ngIf="vistaActual === 'categorias'"></app-categorias>
        <app-ingredientes *ngIf="vistaActual === 'ingredientes'"></app-ingredientes>
        <app-sizes *ngIf="vistaActual === 'sizes'"></app-sizes>
        <app-extras *ngIf="vistaActual === 'extras'"></app-extras>
        <app-promociones *ngIf="vistaActual === 'promociones'"></app-promociones>
        <app-orders
          *ngIf="vistaActual === 'orders'"
          [orderIdToOpen]="pedidoSeleccionadoId"
          (orderOpened)="pedidoSeleccionadoId = null"
        ></app-orders>
        <app-notas-credito *ngIf="vistaActual === 'notas-credito'"></app-notas-credito>
        <app-delivery-config *ngIf="vistaActual === 'delivery'"></app-delivery-config>
        <app-payments *ngIf="vistaActual === 'payments'"></app-payments>
        <app-metodos-pago *ngIf="vistaActual === 'metodos-pago'"></app-metodos-pago>
        <app-reviews *ngIf="vistaActual === 'reviews'"></app-reviews>
        <app-perfil-admin *ngIf="vistaActual === 'mi-perfil'"></app-perfil-admin>
      </div>
    </div>
  </section>

  <div
    *ngIf="mostrarModalLogout"
    class="fixed inset-0 bg-black/60 z-[6000] flex items-center justify-center p-4 backdrop-blur-xs"
    role="dialog"
    aria-modal="true"
    aria-labelledby="logout-modal-title-admin"
  >
    <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden animate-fade-in-up border border-gray-200">
      <div class="px-6 py-4 bg-gray-900 text-white flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-red-600 flex items-center justify-center text-white">
            <i class="bi bi-box-arrow-left text-sm"></i>
          </div>
          <div>
            <p class="text-[10px] font-black uppercase tracking-widest text-red-400 m-0">Seguridad de Sesión</p>
            <h3 id="logout-modal-title-admin" class="text-base font-black text-white m-0">Cerrar Sesión</h3>
          </div>
        </div>
        <button
          type="button"
          (click)="cancelarLogout()"
          class="w-8 h-8 flex items-center justify-center rounded-xl bg-white/10 text-gray-300 hover:bg-white/20 hover:text-white transition-colors cursor-pointer"
          aria-label="Cancelar"
        >
          <i class="bi bi-x-lg text-xs"></i>
        </button>
      </div>

      <div class="p-6 space-y-4">
        <p class="text-sm text-gray-600 m-0 leading-relaxed">
          ¿Estás seguro de que deseas cerrar tu sesión de <strong class="text-gray-900">Administrador</strong>? Tendrás que volver a autenticarte para acceder al panel.
        </p>

        <div class="flex items-center justify-end gap-3 pt-2">
          <button
            type="button"
            (click)="cancelarLogout()"
            class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-sm transition-colors cursor-pointer"
          >
            Cancelar
          </button>
          <button
            type="button"
            (click)="confirmarLogout()"
            class="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-sm shadow-sm transition-colors flex items-center gap-2 cursor-pointer"
          >
            <i class="bi bi-box-arrow-left"></i> Sí, Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
