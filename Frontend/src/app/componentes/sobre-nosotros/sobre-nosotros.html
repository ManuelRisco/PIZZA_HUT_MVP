<section class="py-12 sm:py-20 md:py-24 bg-[var(--surface-page)] relative overflow-hidden font-sans border-b border-[var(--border-subtle)]">

  <div class="container mx-auto px-4 md:px-8 relative z-10">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10 items-center">

      <div class="lg:col-span-5 animate-on-scroll opacity-0 translate-y-10 transition-all duration-700 ease-out order-2 lg:order-1">
        <h2 class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight text-gray-900 mb-5 leading-[1.15]">
          El verdadero sabor del <span class="text-[#d9251b]">Sur de Lima</span>
        </h2>

        <p class="text-gray-700 text-base sm:text-lg leading-relaxed mb-7">
          En <strong>Eco Pizza</strong> preparamos cada día masa fresca con ingredientes seleccionados y horneados al momento para compartir en familia.
        </p>

        <div class="flex flex-wrap gap-6 sm:gap-8 mb-6 sm:mb-8">
          <div class="flex flex-col">
            <span class="text-2xl sm:text-3xl font-bold text-[#039340] mb-0.5 eco-num">100%</span>
            <span class="text-xs sm:text-sm font-semibold text-gray-700">Natural</span>
          </div>
          <div class="w-px h-11 bg-gray-200 hidden sm:block"></div>
          <div class="flex flex-col">
            <span class="text-2xl sm:text-3xl font-bold text-[#d9251b] mb-0.5 eco-num">+15</span>
            <span class="text-xs sm:text-sm font-semibold text-gray-700">Variedades</span>
          </div>
          <div class="w-px h-11 bg-gray-200 hidden sm:block"></div>
          <div class="flex flex-col">
            <span class="text-2xl sm:text-3xl font-bold text-gray-900 mb-0.5 eco-num">5 <i class="bi bi-star-fill text-[#039340] text-xl sm:text-2xl" aria-hidden="true"></i></span>
            <span class="text-xs sm:text-sm font-semibold text-gray-700">Calidad</span>
          </div>
        </div>

      </div>

      <div class="lg:col-span-7 animate-on-scroll opacity-0 translate-y-10 transition-all duration-700 delay-150 ease-out order-1 lg:order-2 relative h-[280px] sm:h-[420px] md:h-[520px] lg:h-[600px] w-full mt-2 lg:mt-0">
        <div class="relative w-full max-w-[680px] mx-auto lg:ml-auto h-full flex items-center justify-center perspective-[1000px]">

          <div class="absolute inset-0 m-auto z-0 w-[90%] aspect-[4/3] rounded-[2rem] sm:rounded-[2.5rem] bg-gradient-to-br from-[#039340]/25 via-[#d9251b]/20 to-transparent opacity-60 transform rotate-12 scale-105 pointer-events-none"></div>

          <div
            class="absolute inset-0 m-auto w-[90%] aspect-[4/3] rounded-[1.75rem] sm:rounded-[2.5rem] overflow-hidden border-[4px] sm:border-[6px] border-white bg-gray-100 transition-all duration-1000 ease-[cubic-bezier(0.22,1,0.36,1)]"
            [ngClass]="{
              'z-20 translate-x-0 translate-y-2 scale-100 rotate-[-1deg] shadow-[0_20px_40px_rgba(0,0,0,0.28)] brightness-100 blur-none': !isSwapped,
              'z-0 translate-x-[10%] -translate-y-[8%] scale-[0.86] rotate-[4deg] shadow-lg brightness-75 blur-[1.5px]': isSwapped
            }">
            <img
              src="/family_custom_pizza_1.webp"
              alt="Familia disfrutando Eco Pizza"
              class="w-full h-full object-cover"
              loading="lazy"
            >
          </div>

          <div
            class="absolute inset-0 m-auto w-[90%] aspect-[4/3] rounded-[1.75rem] sm:rounded-[2.5rem] overflow-hidden border-[4px] sm:border-[6px] border-white bg-gray-100 transition-all duration-1000 ease-[cubic-bezier(0.22,1,0.36,1)]"
            [ngClass]="{
              'z-20 translate-x-0 translate-y-2 scale-100 rotate-[-1deg] shadow-[0_20px_40px_rgba(0,0,0,0.28)] brightness-100 blur-none': isSwapped,
              'z-0 translate-x-[10%] -translate-y-[8%] scale-[0.86] rotate-[4deg] shadow-lg brightness-75 blur-[1.5px]': !isSwapped
            }">
            <img
              src="/family_custom_pizza_2.webp"
              alt="Nuestras deliciosas pizzas"
              class="w-full h-full object-cover"
              loading="lazy"
            >
          </div>

          <div class="absolute bottom-2 left-2 sm:bottom-6 sm:left-4 md:bottom-10 md:-left-2 z-30 bg-white p-2.5 sm:p-4 md:p-5 rounded-xl sm:rounded-2xl shadow-[0_12px_30px_rgba(0,0,0,0.22)] border-2 border-[#039340]/30 flex items-center gap-3">
            <div class="w-11 h-11 sm:w-13 sm:h-13 md:w-14 md:h-14 rounded-xl bg-white p-1 border-2 border-[#039340] flex items-center justify-center shadow-sm shrink-0">
              <img src="/logo.webp" alt="Logo Eco Pizza" class="w-full h-full object-contain">
            </div>
            <div>
              <div class="text-[#161616] font-black text-sm sm:text-base md:text-lg leading-tight">Eco Pizza</div>
              <div class="text-[#039340] text-[10px] sm:text-xs font-extrabold uppercase tracking-wider">Momentos inolvidables</div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
