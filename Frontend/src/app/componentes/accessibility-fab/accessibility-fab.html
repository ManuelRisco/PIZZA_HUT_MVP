<div class="fab-overlay" [class.active]="isPanelOpen" (click)="closePanel()"></div>

<div class="accessibility-fab-container" [class.mobile-mode]="isMobile" [class.shifted-up]="!isMobile && (accessibilityService.shortcutsGuide$ | async)">
  <div class="accessibility-panel" [class.open]="isPanelOpen" [class.compact-panel]="isMobile" aria-label="Panel de accesibilidad" aria-modal="true">

    <div class="panel-header">
      <div class="panel-title">
        <img src="accessibility-icon.svg" alt="" class="panel-icon" aria-hidden="true">
        <span>Accesibilidad</span>
      </div>
      <div class="panel-header-actions">
        <button *ngIf="tieneCambiosActivos" type="button" class="panel-reset" (click)="resetAccesibilidad()" title="Restablecer ajustes" aria-label="Restablecer ajustes">
          <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
        </button>
        <button type="button" class="panel-close" (click)="closePanel()" aria-label="Cerrar panel de accesibilidad">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <div class="panel-body">
      <div class="panel-section">
        <div class="section-title">
          <i class="bi bi-fonts" aria-hidden="true"></i>
          <span>Tamaño de Texto</span>
        </div>
        <div *ngIf="isMobile" class="font-segmented" role="radiogroup" aria-label="Tamaño de fuente">
          <button
            *ngFor="let size of mobileFontSizes"
            type="button"
            class="segmented-btn"
            role="radio"
            (click)="setFontSize(size)"
            [class.active]="tamanoFuente === size"
            [attr.aria-checked]="tamanoFuente === size"
            [attr.aria-label]="getFontSizeLabel(size)">
            {{ getCompactFontLabel(size) }}
          </button>
        </div>
        <div *ngIf="!isMobile" class="font-size-grid" role="radiogroup" aria-label="Tamaño de fuente">
          <button
            *ngFor="let size of fontSizes"
            type="button"
            class="font-option"
            role="radio"
            (click)="setFontSize(size)"
            [class.active]="tamanoFuente === size"
            [attr.aria-checked]="tamanoFuente === size">
            <span class="font-label">{{ getFontSizeLabel(size) }}</span>
          </button>
        </div>
      </div>

      <div class="panel-divider"></div>

      <div class="panel-section">
        <button
          type="button"
          class="toggle-option"
          (click)="toggleDarkMode()"
          [class.active]="modoOscuro"
          role="switch"
          [attr.aria-checked]="modoOscuro"
          aria-label="Modo oscuro">
          <span class="option-info">
            <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
            <span>Modo Oscuro</span>
          </span>
          <span class="toggle-switch" [class.on]="modoOscuro">
            <span class="toggle-knob"></span>
          </span>
        </button>
      </div>

      <div class="panel-divider"></div>

      <div class="panel-section">
        <button
          type="button"
          class="toggle-option"
          (click)="toggleAltoContraste()"
          [class.active]="contrasteAlto"
          role="switch"
          [attr.aria-checked]="contrasteAlto"
          aria-label="Alto contraste">
          <div class="option-info">
            <i class="bi bi-circle-half" aria-hidden="true"></i>
            <span>Alto Contraste</span>
          </div>
          <div class="toggle-switch" [class.on]="contrasteAlto">
            <div class="toggle-knob"></div>
          </div>
        </button>

        <button
          type="button"
          class="toggle-option"
          (click)="toggleDyslexiaMode()"
          [class.active]="modoDislexia"
          role="switch"
          [attr.aria-checked]="modoDislexia"
          aria-label="Modo lectura fácil para dislexia">
          <div class="option-info">
            <i class="bi bi-book" aria-hidden="true"></i>
            <span>Lectura Fácil</span>
          </div>
          <div class="toggle-switch" [class.on]="modoDislexia">
            <div class="toggle-knob"></div>
          </div>
        </button>

        <button
          *ngIf="!isMobile"
          type="button"
          class="toggle-option"
          (click)="toggleReduceMotion()"
          [class.active]="reducirMovimiento"
          role="switch"
          [attr.aria-checked]="reducirMovimiento"
          aria-label="Reducir animaciones y movimiento">
          <div class="option-info">
            <i class="bi bi-stop-circle" aria-hidden="true"></i>
            <span>Reducir Movimiento</span>
          </div>
          <div class="toggle-switch" [class.on]="reducirMovimiento">
            <div class="toggle-knob"></div>
          </div>
        </button>
      </div>

      <ng-container *ngIf="!isMobile">
        <div class="panel-divider"></div>

        <div class="panel-section">
          <div class="section-title">
            <i class="bi bi-palette" aria-hidden="true"></i>
            <span>Filtros de Color</span>
          </div>
          <div class="option-grid" role="radiogroup" aria-label="Filtros para daltonismo">
            <button
              *ngFor="let mode of colorblindModes"
              type="button"
              class="chip-option"
              role="radio"
              (click)="setColorblindMode(mode)"
              [class.active]="modoColorblind === mode"
              [attr.aria-checked]="modoColorblind === mode">
              {{ getColorblindLabel(mode) }}
            </button>
          </div>
        </div>

        <div class="panel-divider"></div>

        <div class="panel-section">
          <ng-container *ngIf="!(accessibilityService.shortcutsGuide$ | async)">
            <div class="section-title">
              <i class="bi bi-keyboard" aria-hidden="true"></i>
              <span>Atajos de Teclado</span>
            </div>
            <div class="shortcuts-grid">
              <div class="shortcut-item"><kbd>Alt</kbd>+<kbd>I</kbd><span>Inicio</span></div>
              <div class="shortcut-item"><kbd>Alt</kbd>+<kbd>M</kbd><span>Menú</span></div>
              <div class="shortcut-item"><kbd>Alt</kbd>+<kbd>E</kbd><span>Extras</span></div>
              <div class="shortcut-item"><kbd>Alt</kbd>+<kbd>O</kbd><span>Promos</span></div>
              <div class="shortcut-item"><kbd>Alt</kbd>+<kbd>C</kbd><span>Carrito</span></div>
              <div class="shortcut-item"><kbd>Alt</kbd>+<kbd>P</kbd><span>Perfil</span></div>
              <div class="shortcut-item"><kbd>Alt</kbd>+<kbd>U</kbd><span>Ubicación</span></div>
              <div class="shortcut-item"><kbd>Alt</kbd>+<kbd>L</kbd><span>Idioma</span></div>
            </div>
          </ng-container>

          <button type="button" class="guide-toggle-btn" (click)="toggleGuia()">
            <i class="bi bi-layout-text-window-reverse" aria-hidden="true"></i>
            {{ (accessibilityService.shortcutsGuide$ | async) ? 'Ocultar barra de atajos' : 'Mostrar barra de atajos' }}
          </button>
        </div>
      </ng-container>
    </div>
  </div>

  <button
    type="button"
    class="fab-button"
    (click)="togglePanel()"
    [class.active]="isPanelOpen"
    [attr.aria-expanded]="isPanelOpen"
    aria-label="Abrir panel de accesibilidad"
    title="Accesibilidad">
    <img src="accessibility-icon.svg" alt="Accesibilidad" class="fab-icon">
  </button>
</div>
