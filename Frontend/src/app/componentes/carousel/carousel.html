<div class="relative w-full h-[460px] sm:h-[580px] md:h-[700px] lg:h-[calc(100dvh-64px)] max-h-[860px] overflow-hidden group">
  <div *ngFor="let img of images; let i = index"
       class="absolute inset-0 w-full h-full transition-opacity duration-1000 ease-in-out"
       [ngClass]="{
         'opacity-100 z-10': i === currentIndex(),
         'opacity-0 z-0': i !== currentIndex()
       }">
    <img [src]="img" class="w-full h-full object-cover transform scale-105 transition-transform duration-[9000ms] ease-out" [ngClass]="{'scale-100': i === currentIndex()}" alt="Pizza Hut Promoción">
  </div>
  
  <div class="absolute inset-0 bg-black/55 z-10 pointer-events-none"></div>

  <div class="absolute inset-0 z-20 flex flex-col items-center justify-center text-center px-5 sm:px-8 md:px-12">
    <h1 class="text-white text-3xl sm:text-5xl md:text-7xl lg:text-8xl font-serif font-bold tracking-wide drop-shadow-2xl mb-4 sm:mb-6 leading-tight carousel-text">
      El Auténtico<br/>Sabor en Cada Trozo
    </h1>
    
    <p class="text-gray-200 text-sm sm:text-base md:text-xl max-w-2xl font-light tracking-wide mb-7 sm:mb-10 drop-shadow-md carousel-text">
      Maestría en la cocina, horneada a la perfección. Una tradición que perdura en cada bocado de nuestras mejores pizzas.
    </p>

    <button class="bg-[#c8102e] hover:bg-[#a50a23] text-white font-bold py-3.5 px-8 sm:py-4 sm:px-10 rounded-lg uppercase tracking-widest text-xs sm:text-sm transition-all duration-300 hover:-translate-y-0.5 active:scale-95 shadow-lg"
            onclick="document.getElementById('menu-section')?.scrollIntoView({behavior: 'smooth'})">
      Ver Menú
    </button>
  </div>

  <button (click)="prev()"
          aria-label="Imagen anterior"
          class="absolute left-2.5 sm:left-4 md:left-8 top-1/2 -translate-y-1/2 z-30 w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center border border-yellow-500/50 rounded-full text-yellow-500 hover:bg-yellow-500 hover:text-black transition-all duration-300 bg-black/45 backdrop-blur-sm opacity-80 md:opacity-0 md:group-hover:opacity-100">
    <i class="bi bi-chevron-left text-lg sm:text-xl"></i>
  </button>

  <button (click)="next()"
          aria-label="Siguiente imagen"
          class="absolute right-2.5 sm:right-4 md:right-8 top-1/2 -translate-y-1/2 z-30 w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center border border-yellow-500/50 rounded-full text-yellow-500 hover:bg-yellow-500 hover:text-black transition-all duration-300 bg-black/45 backdrop-blur-sm opacity-80 md:opacity-0 md:group-hover:opacity-100">
    <i class="bi bi-chevron-right text-lg sm:text-xl"></i>
  </button>

  <div class="absolute bottom-8 left-0 right-0 z-30 flex justify-center space-x-3">
    <button *ngFor="let img of images; let i = index"
            (click)="goTo(i)"
            [attr.aria-label]="'Ir a la imagen ' + (i + 1)"
            class="w-3 h-3 rounded-full border border-yellow-500 transition-colors duration-300"
            [ngClass]="i === currentIndex() ? 'bg-yellow-500' : 'bg-transparent hover:bg-yellow-500/50'">
    </button>
  </div>
</div>
