<div class="relative w-full h-[460px] sm:h-[580px] md:h-[700px] lg:h-[calc(100dvh-64px)] max-h-[860px] overflow-hidden group">
  <div *ngFor="let img of images; let i = index"
       class="absolute inset-0 w-full h-full transition-opacity duration-1000 ease-in-out"
       [ngClass]="{
         'opacity-100 z-10': i === currentIndex(),
         'opacity-0 z-0': i !== currentIndex()
       }">
    <img [src]="img" class="w-full h-full object-cover transform scale-105 transition-transform duration-[9000ms] ease-out" [ngClass]="{'scale-100': i === currentIndex()}" [alt]="'Promoción ' + (i + 1) + ' de Eco Pizza'">
  </div>

  <div class="absolute inset-0 bg-gradient-to-b from-black/65 via-black/50 to-[#161616]/80 z-10 pointer-events-none"></div>

  <div class="absolute inset-0 z-20 flex flex-col items-center justify-center text-center px-5 sm:px-8 md:px-12">
    <h1 class="text-white text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-bold tracking-tight drop-shadow-2xl mb-4 sm:mb-6 leading-tight carousel-text">
      El Auténtico<br/>Sabor en Cada Trozo
    </h1>

    <p class="text-gray-200 text-sm sm:text-base md:text-xl max-w-2xl font-normal mb-7 sm:mb-10 drop-shadow-md carousel-text">
      Masa fresca artesanal e ingredientes seleccionados horneados al momento.
    </p>

    <button type="button"
            class="bg-[#d9251b] hover:bg-[#b31d15] text-white font-semibold py-3.5 px-8 sm:py-4 sm:px-10 rounded-xl text-sm sm:text-base transition-all duration-200 hover:-translate-y-0.5 active:scale-95 shadow-lg border border-white/15 cursor-pointer"
            (click)="scrollToMenu()">
      Ver Menú
    </button>
  </div>

  <button type="button"
          (click)="prev()"
          aria-label="Imagen anterior"
          class="absolute left-2.5 sm:left-4 md:left-8 top-1/2 -translate-y-1/2 z-30 w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center border border-emerald-400/60 rounded-full text-emerald-400 hover:bg-emerald-600 hover:text-white hover:border-emerald-500 transition-all duration-300 bg-black/50 backdrop-blur-sm opacity-80 md:opacity-0 md:group-hover:opacity-100 cursor-pointer">
    <i class="bi bi-chevron-left text-lg sm:text-xl" aria-hidden="true"></i>
  </button>

  <button type="button"
          (click)="next()"
          aria-label="Siguiente imagen"
          class="absolute right-2.5 sm:right-4 md:right-8 top-1/2 -translate-y-1/2 z-30 w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center border border-emerald-400/60 rounded-full text-emerald-400 hover:bg-emerald-600 hover:text-white hover:border-emerald-500 transition-all duration-300 bg-black/50 backdrop-blur-sm opacity-80 md:opacity-0 md:group-hover:opacity-100 cursor-pointer">
    <i class="bi bi-chevron-right text-lg sm:text-xl" aria-hidden="true"></i>
  </button>

  <div class="absolute bottom-8 left-0 right-0 z-30 flex justify-center space-x-3">
    <button type="button"
            *ngFor="let img of images; let i = index"
            (click)="goTo(i)"
            [attr.aria-label]="'Ir a la imagen ' + (i + 1)"
            class="w-3 h-3 rounded-full border border-emerald-400 transition-colors duration-300 cursor-pointer"
            [ngClass]="i === currentIndex() ? 'bg-emerald-500' : 'bg-transparent hover:bg-emerald-400/50'">
    </button>
  </div>
</div>
