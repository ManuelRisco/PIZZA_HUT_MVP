services:
  backend:
    image: pizzahut-backend:latest
    container_name: pizzahut-backend-1
    build:
      context: ./Backend/demo
      dockerfile: Dockerfile
    ports:
      - "8089:8089"
    env_file:
      - ./Backend/demo/.env
    environment:
      - DB_URL=jdbc:sqlserver://host.docker.internal:1433;databaseName=pizzahut_bd;encrypt=true;trustServerCertificate=true;
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Backend/demo/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    image: pizzahut-frontend:latest
    container_name: pizzahut-frontend-1
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
