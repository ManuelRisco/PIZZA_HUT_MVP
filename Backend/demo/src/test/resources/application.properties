spring.application.name=MondongoTest
server.port=-1

# =====================================================
# BASE DE DATOS AISLADA EXCLUSIVAMENTE PARA PRUEBAS
# NUNCA SE CONECTA A pizzahut_bd (EVITA MEZCLA DE DATOS)
# =====================================================
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/pizzahut_test_bd?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# HIKARICP (POOL DE CONEXIONES PARA PRUEBAS)
# =====================================================
spring.datasource.hikari.pool-name=HikariTestPool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.auto-commit=true

# =====================================================
# JPA / HIBERNATE PARA PRUEBAS
# Genera el esquema en la base de datos de pruebas y lo limpia al finalizar
# =====================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# =====================================================
# JWT PARA PRUEBAS
# =====================================================
app.jwtSecret=mySecretKeymySecretKeymySecretKeymySecretKeymySecretKeymySecretKey
app.jwtExpirationInMs=900000
app.jwtRefreshExpirationInMs=86400000

# =====================================================
# LOGGING
# =====================================================
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.cache=WARN

# =====================================================
# UPLOADS PARA PRUEBAS
# =====================================================
spring.servlet.multipart.enabled=true
app.upload.dir=build/test-uploads
app.upload.max-width=800
app.upload.max-height=800
app.upload.thumbnail-width=200
app.upload.thumbnail-height=200

