spring.application.name=Mondongo
server.port=8089

# Cargar variables desde .env si existe (directorio actual o raiz del proyecto)
spring.config.import=optional:file:.env[.properties],optional:file:Backend/demo/.env[.properties],optional:file:demo/.env[.properties],optional:file:../../.env[.properties],optional:file:../.env[.properties]

# =====================================================
# BASE DE DATOS SQL SERVER (PC-FABRIZZIO)
# =====================================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=pizzahut_bd;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=pizzahut_user
spring.datasource.password=pizzahut123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =====================================================
# HIKARICP (POOL DE CONEXIONES)
# =====================================================
spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=true

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# =====================================================
# JWT
# =====================================================
app.jwtSecret=${JWT_SECRET:mySecretKeymySecretKeymySecretKeymySecretKeymySecretKeymySecretKey}
app.jwtExpirationInMs=${JWT_EXPIRATION_MS:900000}
app.jwtRefreshExpirationInMs=${JWT_REFRESH_EXPIRATION_MS:86400000}

# =====================================================
# TOMCAT Y PROTECCION ANTI-DDOS / SLOWLORIS
# =====================================================
server.tomcat.max-connections=8192
server.tomcat.accept-count=500
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.connection-timeout=5000
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB

# =====================================================
# LOGGING
# =====================================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.cache=WARN

# =====================================================
# UPLOADS (Subida de archivos/imagenes)
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
app.upload.max-width=800
app.upload.max-height=800
app.upload.thumbnail-width=200
app.upload.thumbnail-height=200

# =====================================================
# CORREO ELECTRONICO (GMAIL SMTP - CARGADO DESDE .env)
# =====================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.enabled=${MAIL_ENABLED:true}
app.stock-alerts.poll-enabled=${STOCK_ALERTS_POLL_ENABLED:true}
app.stock-alerts.poll-ms=${STOCK_ALERTS_POLL_MS:5000}
app.stock-alerts.batch-window-seconds=${STOCK_ALERTS_BATCH_WINDOW_SECONDS:60}

# =====================================================
# GOOGLE OAUTH2 (OPCIONAL DESDE .env)
# =====================================================
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.allow-dev-mode=${GOOGLE_ALLOW_DEV_MODE:true}

# =====================================================
# SEGURIDAD ANTI-DDOS (RATE LIMITING POR IP)
# =====================================================
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:15}
app.security.rate-limit.write-per-minute=${RATE_LIMIT_WRITE_PER_MINUTE:60}
app.security.rate-limit.general-per-minute=${RATE_LIMIT_GENERAL_PER_MINUTE:240}
