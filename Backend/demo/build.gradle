plugins {
	id 'java'
	id 'eclipse'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'org.sonarqube' version '6.0.1.5171'
}

springBoot {
	mainClass = 'com.example.DemoApplication'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

sourceSets {
	e2e {
		java.srcDir 'src/e2e/java'
	}
}

configurations {
	e2eImplementation.extendsFrom testImplementation
	e2eRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
	testImplementation 'org.testcontainers:mysql:1.20.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	e2eImplementation 'org.seleniumhq.selenium:selenium-java:4.34.0'
	compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
}

tasks.register('e2e', Test) {
	description = 'Pruebas end to end del frontend con Selenium'
	group = 'verification'
	testClassesDirs = sourceSets.e2e.output.classesDirs
	classpath = sourceSets.e2e.runtimeClasspath
	useJUnitPlatform()
	outputs.upToDateWhen { false }
	testLogging {
		events 'started', 'passed', 'failed', 'skipped'
		showStandardStreams = true
		exceptionFormat = 'short'
	}
}

// IMPORTANTE: La flag '-parameters' es REQUERIDA por Spring para resolver parámetros en request mappings
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs.add('-parameters')
	options.encoding = 'UTF-8'
}

// ===== Eclipse / VS Code Java Language Server (Buildship) =====
eclipse {
	synchronizationTasks 'compileJava', 'eclipseJdt'
	classpath {
		plusConfigurations += [configurations.e2eCompileClasspath, configurations.e2eRuntimeClasspath]
		file {
			whenMerged { cp ->
				// Eliminar entradas duplicadas de código generado en bin/ creadas por Eclipse APT
				cp.entries.removeAll { it.kind == 'src' && (it.path?.contains('bin/generated') || it.path?.startsWith('bin/')) }

				def genPath = 'build/generated/sources/annotationProcessor/java/main'
				def genDir = file(genPath)
				if (!genDir.exists()) {
					genDir.mkdirs()
				}
				def existing = cp.entries.find { it.kind == 'src' && it.path == genPath }
				if (existing == null) {
					def entry = new org.gradle.plugins.ide.eclipse.model.SourceFolder(genPath, null)
					entry.entryAttributes['optional'] = 'true'
					entry.entryAttributes['ignore_optional_problems'] = 'true'
					cp.entries.add(entry)
				} else {
					existing.entryAttributes['optional'] = 'true'
					existing.entryAttributes['ignore_optional_problems'] = 'true'
				}

				def e2eDir = file('src/e2e/java')
				if (!e2eDir.exists()) {
					e2eDir.mkdirs()
				}
				def e2eEntry = cp.entries.find { it.kind == 'src' && it.path == 'src/e2e/java' }
				if (e2eEntry != null) {
					e2eEntry.entryAttributes['optional'] = 'true'
					e2eEntry.entryAttributes['ignore_optional_problems'] = 'true'
				}
			}
		}
	}
	jdt {
		file {
			withProperties { props ->
				props['org.eclipse.jdt.core.compiler.processAnnotations'] = 'disabled'
				props['org.eclipse.jdt.core.compiler.annotation.nullanalysis'] = 'disabled'
				props['org.eclipse.jdt.core.compiler.problem.unusedParameter'] = 'ignore'
				props['org.eclipse.jdt.core.compiler.problem.unusedExceptionParameter'] = 'ignore'
				props['org.eclipse.jdt.core.compiler.problem.missingSerialVersion'] = 'ignore'
				props['org.eclipse.jdt.core.compiler.codegen.methodParameters'] = 'generate'
			}
		}
	}
}

// ===== JaCoCo (Cobertura de Tests) =====
jacoco {
	toolVersion = "0.8.12"
}

tasks.named('test') {
    useJUnitPlatform()
    // Agregar Mockito como agente
    jvmArgs = ["-javaagent:${classpath.find { it.name.contains('byte-buddy-agent') }.absolutePath}"]
    ignoreFailures = true
    finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

// ===== SonarQube Configuration =====
sonarqube {
	properties {
		property "sonar.projectKey", "ManuelRisco_PIZZA_HUT_MVP_Backend"
		property "sonar.projectName", "Pizza Hut MVP - Backend"
		property "sonar.host.url", System.getenv("SONAR_HOST_URL") ?: "http://localhost:9000"
		property "sonar.token", System.getenv("SONAR_TOKEN") ?: ""
		property "sonar.java.source", "21"
		property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
		property "sonar.exclusions", "**/config/**,**/dto/**,**/models/**"
	}
}
